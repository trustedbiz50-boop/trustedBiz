services:
  - type: web
    name: trustedbiz
    env: python
    buildCommand: apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 300 --keep-alive 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # app.py reads ADMIN_PASSWORD (not ADMIN_PASS). Set the real value in the
      # Render dashboard; it is deliberately not stored in this file.
      - key: ADMIN_PASSWORD
        sync: false
      # Master switch for running customer Python/Node apps. Leave false until
      # an app server exists. Uploads are stored either way.
      - key: APP_HOSTING_ENABLED
        value: "false"
