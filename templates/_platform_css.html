<style>
:root{
  --ink:#0d1c1c; --paper:#f5f8f8; --surface:#ffffff; --line:#d8e4e4;
  --text:#0d1c1c; --mid:#43605f; --dim:#6f8c8b;
  --teal:#2b7a78; --teal-ink:#ffffff;
  --live:#15803d; --soon:#a16207;
  --term-bg:#0d1c1c; --term-text:#d7ecea; --term-dim:#7fa3a0; --term-ok:#6ee7b7;
  --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#eef5f4; --paper:#0d1412; --surface:#141d1b; --line:#233230;
    --text:#eef5f4; --mid:#a9c4c1; --dim:#7d9a97;
    --teal:#4fb3b0; --teal-ink:#0d1412;
    --live:#4ade80; --soon:#fbbf24;
    --term-bg:#0a100f; --term-text:#d7ecea; --term-dim:#6f918e; --term-ok:#6ee7b7;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header.top{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
header.top .wrap{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:var(--mono);font-weight:500;font-size:16px}
.logo span{color:var(--teal)}
nav.main{display:flex;align-items:center;gap:6px}
nav.main a{font-size:13.5px;font-weight:500;color:var(--mid);padding:8px 10px}
nav.main a:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border:1.5px solid var(--line);color:var(--text);font-weight:600;font-size:14px;border-radius:4px;background:transparent;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--text)}
.btn.solid{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.btn.solid:hover{filter:brightness(1.08)}
.btn.sm{padding:8px 14px;font-size:13px}
@media(max-width:640px){nav.main a.hide-sm{display:none}}

.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;padding:2px 7px;border:1px solid var(--line);color:var(--dim);border-radius:3px;white-space:nowrap}
.tag.live{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent)}
.tag.soon{color:var(--soon);border-color:color-mix(in srgb,var(--soon) 50%,transparent)}

h1.display{font-size:clamp(34px,6vw,54px);line-height:1.05;letter-spacing:-1.6px;font-weight:800;max-width:15ch}
h2.title{font-size:clamp(22px,3.4vw,30px);letter-spacing:-.6px;font-weight:800;line-height:1.15;max-width:22ch}
.lede{font-size:17px;color:var(--mid);max-width:50ch;margin-top:18px;line-height:1.6}
.sub{font-size:15px;color:var(--mid);max-width:56ch;margin-top:10px}
section.block{padding:64px 0;border-top:1px solid var(--line)}

table.status{width:100%;border-collapse:collapse;margin-top:26px;font-size:14.5px}
table.status td{padding:14px 10px 14px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--mid)}
table.status td:first-child{color:var(--text);font-weight:600;width:34%}
table.status td:last-child{text-align:right;white-space:nowrap;width:1%}
@media(max-width:640px){table.status td:first-child{width:auto}table.status td:nth-child(2){display:none}}

footer.bottom{border-top:1px solid var(--line);padding:34px 0 46px;margin-top:0}
footer.bottom .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;font-size:13.5px;color:var(--mid)}
footer.bottom .links{display:flex;flex-wrap:wrap;gap:6px 20px}
footer.bottom a:hover{color:var(--text);text-decoration:underline}
</style>
