<!DOCTYPE html>
<html lang="en">
<head>
<title>Login | TrustedBiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2b7a78;--brand-dark:#1f5c5a;--brand-light:#3a9e9b;
  --bg:#f5f8f8;--surface:#fff;--border:#d8e4e4;
  --text:#0d1c1c;--mid:#43605f;--dim:#8aa5a4;
  --yellow-bg:#fdf3e3;--yellow-text:#92400e;--yellow-border:#f0d9ae;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1412;--surface:#141d1b;--border:#233230;
    --text:#eef5f4;--mid:#a9c4c1;--dim:#5f7d7a;
    --yellow-bg:rgba(180,83,9,.14);--yellow-text:#f0b25e;--yellow-border:rgba(180,83,9,.35);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

header{background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:var(--mono);font-weight:500;font-size:15px;}
.logo span{color:var(--brand);}
.back{font-size:13.5px;font-weight:500;color:var(--mid);}
.back:hover{color:var(--text);}

.auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:34px 32px;width:100%;max-width:400px;}
.auth-head{margin-bottom:24px;}
.auth-head h2{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px;}
.auth-head p{font-size:13.5px;color:var(--dim);}

.flash{background:var(--yellow-bg);border-left:3px solid var(--yellow-border);color:var(--yellow-text);padding:10px 14px;font-size:13px;margin-bottom:18px;border-radius:3px;}

.form-group{margin-bottom:15px;}
.form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--mid);margin-bottom:6px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.3px;}
.form-group input{width:100%;padding:11px 13px;font-size:14px;border:1.5px solid var(--border);border-radius:4px;outline:none;font-family:var(--font);background:var(--bg);color:var(--text);transition:border-color .15s;}
.form-group input:focus{border-color:var(--brand);}
.form-group input::placeholder{color:var(--dim);}

.submit-btn{width:100%;padding:12px;background:var(--text);color:var(--bg);font-size:14.5px;font-weight:700;border:1.5px solid var(--text);border-radius:4px;cursor:pointer;margin-top:6px;font-family:var(--font);transition:background .12s,border-color .12s;}
.submit-btn:hover{background:var(--brand);border-color:var(--brand);}

.auth-footer{text-align:center;margin-top:20px;font-size:13.5px;color:var(--dim);}
.auth-footer a{color:var(--brand);font-weight:600;}

.pw-wrap{position:relative;display:flex;align-items:center;}
.pw-wrap input{flex:1;padding-right:42px;}
.pw-toggle{position:absolute;right:8px;background:none;border:none;cursor:pointer;color:var(--dim);padding:6px;line-height:1;display:flex;}
.pw-toggle:hover{color:var(--brand);}
.pw-toggle svg{width:17px;height:17px;}

@media(max-width:480px){.auth-box{padding:26px 22px;}header{padding:0 16px;}}
</style>
</head>
<body>
<header>
  <a href="/" class="logo">Trusted<span>Biz</span></a>
  <a href="/" class="back">← Home</a>
</header>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-head">
      <h2>Welcome back</h2>
      <p>Log in to manage your business</p>
    </div>
    {% with messages = get_flashed_messages() %}{% if messages %}{% for msg in messages %}
    <div class="flash">{{ msg }}</div>
    {% endfor %}{% endif %}{% endwith %}
    <form method="POST">
      <div class="form-group"><label>Email address</label><input type="email" name="email" placeholder="you@email.com" required></div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="pw1" placeholder="Enter your password" required>
          <button type="button" class="pw-toggle" onclick="togglePw('pw1',this)" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="submit-btn">Log in</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="/register">Create one free</a></div>
  </div>
</div>
<script>
function togglePw(id, btn){
  var inp = document.getElementById(id);
  var eyeOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var eyeOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2M9.9 4.2A11 11 0 0123 12s-1.3 2.3-3.6 4.1M6.1 6.1C3.9 7.6 2 12 2 12s4 7 11 7c1.4 0 2.7-.3 3.9-.7"/></svg>';
  if(inp.type === 'password'){ inp.type = 'text'; btn.innerHTML = eyeOff; }
  else { inp.type = 'password'; btn.innerHTML = eyeOpen; }
}
</script>
</body>
</html>
