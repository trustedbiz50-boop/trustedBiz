<!DOCTYPE html>
<html lang="en">
<head>
<title>Admin Login | TrustedBiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2b7a78;--bg:#0e1513;--surface:#141d1b;--border:#233230;
  --text:#eef5f4;--mid:#a9c4c1;--dim:#5f7d7a;
  --yellow-bg:rgba(180,83,9,.14);--yellow-text:#f0b25e;--yellow-border:rgba(180,83,9,.35);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
.box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:36px 32px;width:100%;max-width:380px;}
.logo{text-align:center;margin-bottom:26px;}
.logo-icon{width:44px;height:44px;border:1.5px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.logo-icon svg{width:22px;height:22px;color:var(--brand);stroke:var(--brand);}
.logo h2{font-size:17px;font-weight:800;margin-bottom:4px;}
.logo p{font-size:12.5px;color:var(--dim);font-family:var(--mono);}
.flash{background:var(--yellow-bg);border-left:3px solid var(--yellow-border);color:var(--yellow-text);padding:10px 14px;border-radius:3px;font-size:13px;margin-bottom:16px;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--mid);margin-bottom:6px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.3px;}
.form-group input{width:100%;padding:11px 14px;font-size:14px;border:1.5px solid var(--border);border-radius:4px;outline:none;font-family:var(--font);background:var(--bg);color:var(--text);}
.form-group input:focus{border-color:var(--brand);}
.submit-btn{width:100%;padding:12px;background:var(--brand);color:#fff;font-size:14.5px;font-weight:700;border:1.5px solid var(--brand);border-radius:4px;cursor:pointer;font-family:var(--font);}
.submit-btn:hover{background:#1f5c5a;}
.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--dim);}
.back:hover{color:var(--text);}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
    </div>
    <h2>Admin panel</h2>
    <p>TrustedBiz — owner access only</p>
  </div>

  {% with messages = get_flashed_messages() %}
  {% if messages %}{% for msg in messages %}
  <div class="flash">{{ msg }}</div>
  {% endfor %}{% endif %}
  {% endwith %}

  <form method="POST" action="/admin">
    <div class="form-group">
      <label>Admin password</label>
      <input type="password" name="admin_pass" placeholder="Enter your admin password" required autofocus>
    </div>
    <button type="submit" class="submit-btn">Enter admin panel</button>
  </form>
  <a href="/" class="back">← Back to TrustedBiz</a>
</div>
</body>
</html>
