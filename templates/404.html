<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found | TrustedBiz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2b7a78;--bg:#f5f8f8;--surface:#fff;--border:#d8e4e4;
  --text:#0d1c1c;--mid:#43605f;--dim:#8aa5a4;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1412;--surface:#141d1b;--border:#233230;--text:#eef5f4;--mid:#a9c4c1;--dim:#5f7d7a; }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
header{border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:var(--mono);font-weight:500;font-size:15px;}
.logo span{color:var(--brand);}
.back{font-size:13.5px;font-weight:500;color:var(--mid);}
.back:hover{color:var(--text);}
.not-found{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;}
.code{font-family:var(--mono);font-size:15px;color:var(--brand);letter-spacing:2px;margin-bottom:18px;}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;}
p{color:var(--dim);font-size:14.5px;margin-bottom:28px;max-width:320px;}
.btn{display:inline-flex;padding:12px 26px;background:var(--text);color:var(--bg);border-radius:4px;font-weight:600;font-size:14px;}
.btn:hover{background:var(--brand);}
</style>
</head>
<body>
<header>
  <a href="/" class="logo">Trusted<span>Biz</span></a>
  <a href="/" class="back">← Home</a>
</header>
<div class="not-found">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist, or was moved.</p>
  <a href="/" class="btn">Go home</a>
</div>
</body>
</html>
