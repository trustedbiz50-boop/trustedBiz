<style>
/* Crest the crane: animations. Everything is CSS, transform-box:view-box so pivots use the SVG's own coordinates. */
.crest,.scene{display:block;max-width:100%;height:auto;overflow:visible}
.crest-face{overflow:hidden}
.ico-art{display:block;flex:none}
.crest *,.scene *{transform-box:view-box}
.cr-wing{transform:rotate(var(--rot,0deg)) scale(var(--sc,1))}
.cr-wing-r{transform-origin:170px 146px}.cr-wing-l{transform-origin:70px 146px}
.cr-eye{transform-box:fill-box;transform-origin:center;animation:crBlink 4.6s infinite}
.crest-think .cr-eye,.crest-lost .cr-eye{animation-duration:5.8s}
.cr-crown{transform-origin:120px 66px;animation:crCrown 3.4s ease-in-out infinite}
.cr-idle,.cr-wave{animation:crBob 2.6s ease-in-out infinite}
.cr-float{animation:crFloat 2.2s ease-in-out infinite}
.cr-breathe{animation:crBreathe 3.8s ease-in-out infinite}
.cr-hop{animation:crHop 1.1s cubic-bezier(.3,.7,.4,1) infinite}
.cr-shake{animation:crShake .5s ease-in-out infinite}
.crest-wave .cr-wing-r,.crest-ok .cr-wing-r{animation:crWave 1.1s ease-in-out infinite}
.crest-happy .cr-wing-l{animation:crFlapL .55s ease-in-out infinite}
.crest-happy .cr-wing-r{animation:crFlapR .55s ease-in-out infinite}
.crest-fly .cr-wing-l{animation:crFlyL .7s ease-in-out infinite}
.crest-fly .cr-wing-r{animation:crFlyR .7s ease-in-out infinite}
.crest-wrench .cr-wing-r{animation:crTinker .6s ease-in-out infinite}
.cr-spark{transform-box:fill-box;animation:crSpark 2.2s ease-in-out infinite}
.cr-conf{transform-box:fill-box;transform-origin:center;animation:crConf 2.4s ease-in infinite}
.cr-think{animation:crThink 2.4s ease-in-out infinite}
.cr-z{animation:crZ 2.6s ease-in infinite;opacity:0}
.cr-gear{transform-box:fill-box;transform-origin:center;animation:crSpin 3.2s linear infinite}
.cr-sweat{animation:crSweat 1.4s ease-in infinite}
.cr-pop{transform-box:fill-box;transform-origin:center;animation:crPop 1.6s ease-in-out infinite}
.cr-speed{animation:crSpeed 1s linear infinite}
.cr-q{animation:crQ 2.2s ease-in-out infinite}
.cr-egg{transform-box:fill-box;transform-origin:50% 100%;animation:crEgg 2.4s ease-in-out infinite}
.cr-flame{transform-box:fill-box;transform-origin:50% 0;animation:crFlame .35s ease-in-out infinite alternate}
.cr-mouth{transform-box:fill-box;transform-origin:center;animation:crTalk .5s ease-in-out infinite alternate}
@keyframes crBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes crCrown{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes crBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes crFloat{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-8px) rotate(-6deg)}}
@keyframes crBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,1.04)}}
@keyframes crHop{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-16px) scale(.97,1.04)}}
@keyframes crShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes crWave{0%,100%{transform:rotate(-104deg)}50%{transform:rotate(-134deg)}}
@keyframes crFlapL{0%,100%{transform:rotate(112deg)}50%{transform:rotate(84deg)}}
@keyframes crFlapR{0%,100%{transform:rotate(-112deg)}50%{transform:rotate(-84deg)}}
@keyframes crFlyL{0%,100%{transform:rotate(100deg) scale(1.3)}50%{transform:rotate(42deg) scale(1.3)}}
@keyframes crFlyR{0%,100%{transform:rotate(-100deg) scale(1.3)}50%{transform:rotate(-42deg) scale(1.3)}}
@keyframes crTinker{0%,100%{transform:rotate(-58deg)}50%{transform:rotate(-40deg)}}
@keyframes crSpark{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}
@keyframes crConf{0%{opacity:0;transform:translateY(-12px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(54px) rotate(200deg)}}
@keyframes crThink{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes crZ{0%{opacity:0;transform:translate(0,10px)}25%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
@keyframes crSpin{to{transform:rotate(360deg)}}
@keyframes crSweat{0%{opacity:0;transform:translateY(-4px)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes crPop{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-5deg)}}
@keyframes crSpeed{0%{opacity:0;transform:translateX(16px)}40%{opacity:.6}100%{opacity:0;transform:translateX(-20px)}}
@keyframes crQ{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes crEgg{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-9deg)}82%{transform:rotate(8deg)}88%{transform:rotate(-6deg)}94%{transform:rotate(4deg)}}
@keyframes crFlame{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
@keyframes crTalk{from{transform:scaleY(.5)}to{transform:scaleY(1)}}

/* deploy scene */
.sc-cloud{animation:scCloud 16s ease-in-out infinite alternate}
.sc-sun{animation:scSun 30s linear infinite}
.sc-fly{animation:scFlight 8s ease-in-out infinite}
.sc-box g{transform-box:fill-box}
.sc-box{animation:scBox 8s ease-in infinite}
.sc-win{transform-box:fill-box;transform-origin:center;animation:scWin 8s ease-in-out infinite}
.sc-live{animation:scLive 8s ease-out infinite}
.sc-conf{animation:scConf 8s ease-out infinite}
.sc-conf-1{animation-delay:.04s}.sc-conf-2{animation-delay:.08s}.sc-conf-3{animation-delay:.12s}.sc-conf-4{animation-delay:.16s}.sc-conf-5{animation-delay:.2s}
.sc-conf circle{opacity:0}
@keyframes scCloud{from{transform:translateX(-14px)}to{transform:translateX(22px)}}
@keyframes scSun{to{transform:rotate(360deg)}}
@keyframes scFlight{
  0%{transform:translate(-60px,34px);opacity:0}
  9%{opacity:1}
  42%{transform:translate(236px,-6px)}
  54%{transform:translate(246px,-10px)}
  80%{transform:translate(520px,-90px);opacity:1}
  88%{opacity:0;transform:translate(580px,-110px)}
  100%{opacity:0;transform:translate(-60px,34px)}}
@keyframes scBox{
  0%,44%{transform:translate(0,0) scale(1);opacity:1}
  50%{transform:translate(44px,36px) scale(.75);opacity:1}
  54%{transform:translate(60px,60px) scale(.4);opacity:0}
  99%{opacity:0}100%{transform:translate(0,0);opacity:1}}
@keyframes scWin{0%,52%{transform:scale(1)}56%{transform:scale(1.05)}60%,100%{transform:scale(1)}}
@keyframes scLive{0%,52%{transform:scale(0)}58%{transform:scale(1.25)}62%,92%{transform:scale(1)}97%,100%{transform:scale(0)}}
@keyframes scConf{0%,52%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(0,0)}}
.sc-conf circle{animation:scPiece 8s ease-out infinite}
.sc-conf-0 circle{--dx:-40px;--dy:-50px}.sc-conf-1 circle{--dx:-18px;--dy:-70px}.sc-conf-2 circle{--dx:6px;--dy:-60px}.sc-conf-3 circle{--dx:30px;--dy:-72px}.sc-conf-4 circle{--dx:52px;--dy:-52px}.sc-conf-5 circle{--dx:70px;--dy:-34px}
@keyframes scPiece{0%,52%{opacity:0;transform:translate(0,0)}54%{opacity:1}68%{opacity:1;transform:translate(var(--dx),var(--dy))}74%,100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 40px))}}
@media (prefers-reduced-motion:reduce){
  .crest *,.scene *{animation:none!important}
  .cr-z,.sc-conf circle{opacity:0!important}.cr-conf{opacity:1!important}
  .sc-fly{transform:translate(236px,-6px)}.sc-box{opacity:0}.sc-live{transform:scale(1)}
}
</style>
